# Optional turnkey Docker Compose configuration for Apache Airflow
# Use this if you install Docker Desktop instead of WSL2.
# Run with: docker compose up -d

services:
  airflow-init:
    image: apache/airflow:2.10.4-python3.10
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Student \
          --lastname MLOps \
          --role Admin \
          --email student@mlops.edu \
          --password admin
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./output:/opt/airflow/output
      - ./logs:/opt/airflow/logs

  airflow-standalone:
    image: apache/airflow:2.10.4-python3.10
    container_name: airflow_standalone
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: standalone
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./output:/opt/airflow/output
      - ./logs:/opt/airflow/logs

